name: macOS build

on:
  push:
    branches:
      - master
      - 'next*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS ${{ matrix.macos }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    env:
      # Secrets can't be used in if: conditions directly
      HAS_TEST_DATA_TOKEN: ${{ secrets.WELLE_TEST_DATA_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: '15'
            architecture: arm64
            runner: macos-15
          - macos: '15'
            architecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set package metadata
        run: |
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtcharts qtmultimedia qtshadertools'
          cache: true

      - name: Install dependencies
        env:
          # Skip brew's automatic update, which fails on stale third-party
          # taps preinstalled on the runner images (e.g. aws/tap).
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ninja fftw faad2 mpg123 lame librtlsdr dylibbundler

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DRTLSDR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        run: |
          test -x build/welle-io.app/Contents/MacOS/welle-io
          test -x build/welle-cli
          plutil -lint build/welle-io.app/Contents/Info.plist
          test "$(plutil -extract CFBundleIdentifier raw build/welle-io.app/Contents/Info.plist)" = "io.welle.welle"
          build/welle-io.app/Contents/MacOS/welle-io --version
          build/welle-cli -h 2>&1 | grep -q "Usage: welle-cli"

      - name: Deploy application bundle
        run: |
          scripts/macos-deploy.sh "$QT_ROOT_DIR"
          build/welle-io.app/Contents/MacOS/welle-io --version

      - name: Create distribution package
        run: |
          mkdir publish
          package_name="${DATE}_${GIT_HASH}_macOS${{ matrix.macos }}_welle-io_${{ matrix.architecture }}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/welle-io.app "publish/$package_name"
          unzip -tq "publish/$package_name"

      # Smoke test: unpack the package like a user and play a recording with
      # it (src/tests/smoke/smoke_test.py)
      - name: Checkout test data
        if: env.HAS_TEST_DATA_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.WELLE_TEST_DATA_REPO || 'AlbrechtL/welle.io-test-data' }}
          token: ${{ secrets.WELLE_TEST_DATA_TOKEN }}
          path: test-data
          sparse-checkout: |
            manifest.json
            scripts/
            clips/odr_dabmod.s8.iq.zst
          sparse-checkout-cone-mode: false

      - name: Smoke test (unpacked application, welle-cli of the build)
        if: env.HAS_TEST_DATA_TOKEN == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          command -v zstd || brew install zstd
          mkdir "$RUNNER_TEMP/app"
          ditto -x -k publish/*.zip "$RUNNER_TEMP/app"
          python3 src/tests/smoke/smoke_test.py --test-data test-data \
            --welle-io "$RUNNER_TEMP/app/welle-io.app/Contents/MacOS/welle-io" \
            --welle-cli build/welle-cli --work-dir smoke-test

      - name: No smoke test
        if: env.HAS_TEST_DATA_TOKEN != 'true'
        run: echo "::warning::WELLE_TEST_DATA_TOKEN is not available, the smoke test is skipped"

      - name: Archive smoke test logs
        if: always() && env.HAS_TEST_DATA_TOKEN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-macos${{ matrix.macos }}-${{ matrix.architecture }}
          path: smoke-test/
          if-no-files-found: ignore

      # The job package-test downloads the packages by this name
      - name: Archive artifacts (welle.io macOS application)
        uses: actions/upload-artifact@v7
        with:
          name: welle.io macOS application (${{ matrix.architecture }})
          path: publish/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload to nightly server
        # The push trigger already restricts refs to master and next*. The
        # env indirection exists because the secrets context is not allowed
        # in a step-level if.
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        if: >-
          github.event_name == 'push' &&
          env.SFTP_USER != '' &&
          env.SFTP_PASSWORD != ''
        uses: dennisameling/ftp-upload-action@v2
        with:
          server: a2f24.netcup.net
          secure: true
          username: ${{ env.SFTP_USER }}
          password: ${{ env.SFTP_PASSWORD }}
          local_dir: publish/

  # Users also run the packages on newer macOS: run their smoke test there.
  # macOS 27 is a public preview runner image (xcode-27) and has no Intel
  # version.
  package-test:
    name: Run macOS 15 package on macOS ${{ matrix.macos }} (${{ matrix.architecture }})
    needs: build
    # Run even if a build failed, each test only needs the package of its
    # architecture
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    env:
      HAS_TEST_DATA_TOKEN: ${{ secrets.WELLE_TEST_DATA_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: '26'
            architecture: arm64
            runner: macos-26
          - macos: '26'
            architecture: x86_64
            runner: macos-26-intel
          - macos: '27'
            architecture: arm64
            runner: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: welle.io macOS application (${{ matrix.architecture }})
          path: publish

      - name: Unpack application
        run: |
          mkdir "$RUNNER_TEMP/app"
          ditto -x -k publish/*.zip "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/welle-io.app/Contents/MacOS/welle-io" --version

      # On the macOS 26 Intel image iconservicesagent crash-loops (Metal
      # assertion on the paravirtualized GPU), so every icon request waits
      # forever. Qt asks for the generic application icon when the first
      # window gets the focus (QCocoaIntegration::focusWindowChanged), so
      # welle-io hangs. Without the agent the request fails at once. See
      # https://github.com/AlbrechtL/welle.io/issues/955. Remove this step
      # when https://github.com/actions/runner-images/issues/14751 is fixed.
      - name: Disable iconservicesagent
        if: matrix.runner == 'macos-26-intel'
        run: |
          launchctl bootout "gui/$(id -u)/com.apple.iconservices.iconservicesagent" || true
          launchctl disable "gui/$(id -u)/com.apple.iconservices.iconservicesagent"

      - name: Checkout test data
        if: env.HAS_TEST_DATA_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.WELLE_TEST_DATA_REPO || 'AlbrechtL/welle.io-test-data' }}
          token: ${{ secrets.WELLE_TEST_DATA_TOKEN }}
          path: test-data
          sparse-checkout: |
            manifest.json
            scripts/
            clips/odr_dabmod.s8.iq.zst
          sparse-checkout-cone-mode: false

      # The package contains only welle-io, welle-cli is not tested here
      - name: Smoke test (unpacked application)
        if: env.HAS_TEST_DATA_TOKEN == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          command -v zstd || brew install zstd
          python3 src/tests/smoke/smoke_test.py --test-data test-data \
            --welle-io "$RUNNER_TEMP/app/welle-io.app/Contents/MacOS/welle-io" \
            --work-dir smoke-test

      - name: No smoke test
        if: env.HAS_TEST_DATA_TOKEN != 'true'
        run: echo "::warning::WELLE_TEST_DATA_TOKEN is not available, the smoke test is skipped"

      - name: Archive smoke test logs
        if: always() && env.HAS_TEST_DATA_TOKEN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-macos${{ matrix.macos }}-${{ matrix.architecture }}
          path: smoke-test/
          if-no-files-found: ignore
